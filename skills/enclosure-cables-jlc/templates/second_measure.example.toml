# Example poses for the independent second measure (cable_second_measure.py), for cables.example.json.
# Written by a second person from the model alone: the two wire exits of each cable (p) with the direction in which the
# wire LEAVES each connector (d), the bend radius, optional via points. Never copy numbers from routes.toml into this file.

[[cable]]
id = "CAB-01"
radius = 6.0
start = {p = [46.3, 32.5, 13.6], d = [0, 0, 1]}
end   = {p = [90.0, 32.5, 13.6], d = [0, 0, 1]}
lead  = [6.0, 6.0]

